<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0d1020">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dig Dash">
  <meta name="description" content="掘って、逃げて、金塊を集める。タッチで遊べるアクションパズル。">
  <title>Dig Dash</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- タイトル -->
  <section id="screen-title" class="screen">
    <div class="title-box">
      <canvas id="title-canvas" aria-hidden="true"></canvas>
      <h1 class="logo">DIG<span>DASH</span></h1>
      <p class="tagline">掘って、逃げて、金塊を集めろ。</p>
      <div class="menu">
        <button class="btn primary" data-go="select">あそぶ</button>
        <button class="btn" data-go="editor">ステージをつくる</button>
        <button class="btn" id="btn-howto">あそびかた</button>
        <button class="btn ghost-btn" id="btn-sound">音: ON</button>
      </div>
    </div>
  </section>

  <!-- ステージ選択 -->
  <section id="screen-select" class="screen" hidden>
    <header class="bar">
      <button class="icon-btn" data-go="title" aria-label="戻る">‹</button>
      <h2>ステージ</h2>
      <span class="star-total" id="star-total"></span>
    </header>
    <div class="scroll">
      <div class="stage-grid" id="stage-grid"></div>
      <h3 class="sub-head">マイステージ</h3>
      <p class="hint" id="custom-empty">「ステージをつくる」で作った面がここに並びます。</p>
      <ul class="custom-list" id="custom-list"></ul>
      <label class="toggle">
        <input type="checkbox" id="opt-ghost"> 自己ベストのゴーストを表示
      </label>
    </div>
  </section>

  <!-- プレイ -->
  <section id="screen-game" class="screen" hidden>
    <header class="hud">
      <button class="icon-btn" id="btn-pause" aria-label="一時停止">Ⅱ</button>
      <div class="hud-name" id="hud-name"></div>
      <div class="hud-stat"><span class="gold-icon"></span><span id="hud-gold">0</span></div>
      <div class="hud-stat" id="hud-time">0.0</div>
    </header>
    <div class="stage" id="stage">
      <canvas id="game-canvas"></canvas>
      <div class="banner" id="death-banner" hidden>
        <strong>やられた！</strong>
        <span>⏪ を長押しで巻き戻し</span>
        <button class="btn small" id="btn-retry">最初から</button>
      </div>
    </div>
    <div class="controls">
      <div class="pad" id="pad"><div class="pad-ring"><span class="pad-knob"></span></div></div>
      <div class="actions">
        <button class="act rewind" id="btn-rewind" aria-label="巻き戻し">⏪</button>
        <button class="act dig" id="btn-dig-l" aria-label="左下を掘る">◣<small>掘</small></button>
        <button class="act dig" id="btn-dig-r" aria-label="右下を掘る">◢<small>掘</small></button>
      </div>
    </div>
  </section>

  <!-- エディタ -->
  <section id="screen-editor" class="screen" hidden>
    <header class="bar">
      <button class="icon-btn" data-go="title" aria-label="戻る">‹</button>
      <input class="name-input" id="ed-name" maxlength="16" placeholder="ステージ名">
      <button class="btn small" id="ed-test">テスト</button>
    </header>
    <div class="stage editor-stage" id="ed-stage">
      <canvas id="ed-canvas"></canvas>
    </div>
    <div class="palette" id="palette"></div>
    <div class="ed-actions">
      <button class="btn small" id="ed-save">保存</button>
      <button class="btn small" id="ed-share">共有</button>
      <button class="btn small" id="ed-new">新規</button>
      <button class="btn small" id="ed-clear">全消去</button>
    </div>
    <p class="hint" id="ed-msg"></p>
  </section>

  <!-- 汎用ダイアログ -->
  <div class="modal" id="modal" hidden>
    <div class="modal-box">
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
      <div class="modal-buttons" id="modal-buttons"></div>
    </div>
  </div>

  <template id="tpl-howto">
    <ul class="howto">
      <li><b>金塊</b>をすべて集めると<b>隠しはしご</b>が現れます。画面の一番上まで登ればクリア。</li>
      <li><b>◣掘 / ◢掘</b>で斜め下のレンガに穴を掘れます。穴はしばらくするとふさがります。</li>
      <li>敵は穴に落ちると数秒動けません。その間は頭の上を歩けます。穴がふさがると敵は埋まり、上から復活します。</li>
      <li>穴の中にいるときにふさがると、自分もアウト。</li>
      <li>鉄ブロックは掘れません。見た目がレンガでも、乗ると落ちる<b>にせの床</b>もあります。</li>
      <li><b>⏪ を長押し</b>すると時間を巻き戻せます。使わずにクリアすると★3つのチャンス。</li>
      <li>キーボード：矢印キーで移動、Z/X で掘る、R で巻き戻し、P で一時停止。</li>
    </ul>
  </template>

  <script type="module" src="js/main.js"></script>
</body>
</html>
